<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Financial Intelligence</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header>
        <h1>AI Financial Intelligence</h1>
        <p>Analyze • Understand • Explore Financial Data</p>
    </header>

    <main>

        <section class="company-selector">

            <label for="companySelect">
                Select Company
            </label>

            <select id="companySelect">
                <option value="">Loading...</option>
            </select>

        </section>


        <section class="cards">

            <div class="card">
                <h3>Current Price</h3>
                <p id="currentPrice">--</p>
            </div>

            <div class="card">
                <h3>Price Change</h3>
                <p id="priceChange">--</p>
            </div>

            <div class="card">
                <h3>Volume</h3>
                <p id="volume">--</p>
            </div>

            <div class="card">
                <h3>Trend</h3>
                <p id="trend">--</p>
            </div>

        </section>


        <section class="chart-container">

            <h2>Historical Stock Price</h2>

            <canvas id="stockChart"></canvas>

        </section>


        <section class="insight">

            <h2>Financial Insight</h2>

            <div class="insight-box">

                <p>
                    Current Trend:
                    <strong id="insightTrend">--</strong>
                </p>

                <p id="insightText">
                    Select a company to view financial information.
                </p>

            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
